name: CI/CD Pipeline Innovatech

on:
  push:
    branches: [ "deploy" ] 
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push images to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          # Build y Push del Backend
          docker build -t $ECR_REGISTRY/innovatech-backend:latest ./backend
          docker push $ECR_REGISTRY/innovatech-backend:latest
          
          # Build y Push del Frontend
          docker build -t $ECR_REGISTRY/innovatech-frontend:latest ./frontend
          docker push $ECR_REGISTRY/innovatech-frontend:latest

      - name: Deploy to EC2 via SSM
        run: |
          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Name,Values=ec2-web" \
            --parameters 'commands=[
              "aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}",
              "cd /home/ec2-user/devops && docker-compose pull",
              "docker-compose up -d",
              "sleep 5",
              "docker exec -u root frontend_innovatech sh -c \"sed -i 's/localhost/34.205.139.91/g' /usr/share/nginx/html/assets/*.js\"",
              "docker exec backend_innovatech sh -c \"find . -type f -name '"'*.js'"' -exec sed -i '"'s|http://localhost:5173|*|g'"' {} +\"",
              "docker restart backend_innovatech"
            ]'